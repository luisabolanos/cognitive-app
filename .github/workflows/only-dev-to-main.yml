name: Validate PR to main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  only-dev-can-merge:
    name: Only dev can merge to main
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "ERROR: Only the dev branch can be merged into main."
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "OK: PR is from dev to main."
