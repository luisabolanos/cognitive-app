name: cognitive_app
description: A cognitive training application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

  # Flutter 3.35+ / Dart 3.9+ is required by the pinned stable dependencies below.

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.17.2
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.2
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
